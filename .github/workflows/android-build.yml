name: Android build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Generate temporary release signing key
        shell: bash
        run: |
          STORE_PASSWORD="$(openssl rand -hex 24)"
          KEY_PASSWORD="$STORE_PASSWORD"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/floral-temporary-release.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias floral-temporary \
            -keypass "$KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 30 \
            -dname "CN=Floral Temporary Build, OU=Android, O=Floral, L=Unknown, ST=Unknown, C=IN"
          {
            echo "FLORAL_KEYSTORE_FILE=$RUNNER_TEMP/floral-temporary-release.jks"
            echo "FLORAL_STORE_PASSWORD=$STORE_PASSWORD"
            echo "FLORAL_KEY_ALIAS=floral-temporary"
            echo "FLORAL_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Assemble temporarily signed small release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename optimized APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/floral-small.apk

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floral-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload temporary-key small release APK
        uses: actions/upload-artifact@v4
        with:
          name: floral-small-release-apk
          path: app/build/outputs/apk/release/floral-small.apk
          if-no-files-found: error
